name: CI
on:
  push: { branches: [master, main] }
  pull_request: { branches: [master, main] }

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      # gofmt 门禁（2026-10-24 补）：此前 fnos/openwrt/qnap 三个 Go 仓的 CI
      # **都没有 gofmt 步**（core/server/p2p/contracts 早已有）⇒ 格式漂移无人拦
      # ⇒ 漂移会一路合进 main。**发现即红，修法是 gofmt -w**，不设豁免。
      - name: Gofmt
        if: always()
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # 门禁步骤**互不阻塞**（if: always()）：此前是串行链 ⇒ 前一步失败 ⇒ 后面
      # 全部 skipped ⇒ 那些门禁等于没跑（core 仓实录：gofmt 步先红 ⇒ race/lint/
      # 架构棘轮全被 skip ⇒ 真实 DATA RACE 藏在 main 上活了两列车）。
      - name: Build & Test
        if: always()
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
      # 依赖漏洞门禁（govulncheck）：可达漏洞即红；修复策略=升依赖地板，不许注释绕过
      - name: Govulncheck
        if: always()
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      # 钉版对账守卫（2026-11-13，U2b 疑虑 1 / PREP-D，Refs pigeonbox/pigeonbox#327）：
      #   fnos 此前是三平台仓里**唯一没有任何 CORE_PIN 校验点**的——qnap 的断言内嵌在
      #   release.yml（只有打 tag 才跑 ⇒ 「PR 全绿 ≠ 守卫全绿」的既有教训），openwrt 有
      #   完整 scripts/check-build-pin.sh ⇒ go.mod 与 DEPS.env 的 CORE_PIN 漂移无人抓。
      #   ⇒ 断言必须挂在**本文件（pull_request 触发）**：放 release.yml 等于漂移已经打进
      #   产物才报。DEPS.env 是第二份钉版真相源（hub 列车 trainctl bump 写入），与 go.mod
      #   平行 ⇒ 只改一边（或 bump 漏改）即红，防「版本幽灵」（qnap 2.1.0 实录）。
      - name: 钉版对账(DEPS.env CORE_PIN == go.mod；FRONTEND_CORE_PIN == web tgz URL)
        if: always()
        run: bash scripts/check-build-pin.sh
      # 负对照自测（守卫自己要有牙齿）：在临时目录里逐条制造漂移 ⇒ 必须**逐条判红并点名**，
      #   复位后恢复绿；任一条判据无区分力（如变异没打中、判据恒真）⇒ 本步自己红。
      - name: 钉版对账负对照自测(制造漂移必须逐条判红点名)
        if: always()
        run: bash scripts/check-build-pin.sh --selfcheck

  # 应用包打包校验:fnos/ 目录结构/manifest/生命周期脚本任何回退都会在此失败,
  # 并产出可安装的 .fpk 供手动装机验证。
  # v1.2.7 起 fpk 为原生模式:打包前须产出双架构静态二进制+前端(app/bin|www)。
  package:
    runs-on: ubuntu-latest
    env:
      # 显式 auto：覆盖 setup-go v7 强制的 GOTOOLCHAIN=local ⇒ 将来 go.mod 的
      # toolchain 地板再抬时，Go 能自动拉取而不是构建失败（2026-10-26 实测：
      # 浮动 go-version 拿到低于地板的 patch ⇒ 直接构建失败，门禁变噪声）。
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.11"
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # npm ci 走网络（拉 frontend-core tgz）⇒ 偶发失败 ⇒ 此前会**连带挡掉**后面的
      # 原生产物构建 ⇒ 连打包产物都没了。加 --fetch-retries 让它自愈重试。
      - name: web 类型检查(2026-10-09 拆仓:web/ 自包含,依赖 frontend-core tgz)
        run: cd web && npm ci --no-audit --no-fund --fetch-retries=3 --fetch-retry-mintimeout=20000 && npm run typecheck
      - name: 原生产物构建(双架构二进制+前端)
        if: always()
        run: ./scripts/build-native.sh
      - name: 下载 fnpack(官方 CLI)
        run: |
          # 供应链:fnpack 是产出 .fpk 的打包器,厂商 CDN 上的二进制必须钉摘要。
          # 摘要取自:
          #   URL:    https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          #   采集日: 2026-10-21(厂商 Last-Modified: Fri, 03 Jul 2026 06:30:35 GMT)
          # 与 release.yml 同源同摘要——CI 验的打包器与发版用的必须是同一个。
          curl -fsSL --retry 3 -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack" | sha256sum -c -
          chmod +x fnpack
      - name: fnpack build
        run: cd fnos && ../fnpack build
      # 2026-10-26 审计 P2：`make fpack` 不重建任何产物 ⇒ 会把上一次的本地产物
      # （陈旧二进制 + 陈旧前端）打进一个「能装」的 fpk ⇒ 包内版本号对、功能旧。
      # ⇒ 打包后校验：fpk 内嵌二进制的版本戳 == VERSION、前端 version.txt ==
      # web/package.json ⇒ 陈旧包直接红（负对照：把 VERSION 改成 9.9.9 即红）。
      - name: fpack 版本戳对账（防陈旧产物进包）
        run: bash scripts/check-fpack-version.sh
      # pb CLI 随包门禁（2026-10-31）：pb 是**源码编译**的（检出 server 同号 tag
      # ⇒ 避开与 server Release 流水线的竞态）⇒ 失败点是**静默降级**（编不出来
      # 就不带 pb，应用照常可用）⇒ 没有门禁的话「fnOS 用户能不能用 pb」只能
      # 靠人工装包后才发现。
      # ⇒ 断言：打包目录与 fpk 内都有 pb 双架构二进制，且**真的能执行**
      # （架构错会 exec format error ⇒ 只判「文件存在」不够）。
      # /beam 生命周期验收脚本是 **fnos#115 关单的证据工具** ⇒ 判据必须能判红
      # ⇒ 用假设备（假 curl/pgrep/ss/id）驱动脚本自己 ⇒ 正常态绿、每条异常态都红。
      - name: /beam 验收脚本判据自证（假设备必须逐条判红）
        run: bash scripts/verify-beam-lifecycle.sh --selfcheck
      - name: pb CLI 随包门禁（双架构 + 可执行）
        if: always()
        run: bash scripts/check-pb-in-fpk.sh
      # 出厂预接线（Beam↔Box 地址与专用 API Key）自测（2026-11-01）：
      # 预接线干两件**错了也不会有人喊**的事——① 建/复用一把 Box API Key；
      # ② 把地址+Key 写进 p2pcweb 配置。若它「每次启动都建一把新 Key」，
      # Key 列表会无声膨胀；若它发了空字段把用户配的 registry 冲掉，
      # 直传注册中心会静默丢失 ⇒ 两类都必须有**能判红**的机械化判据。
      # 本自测跑**真脚本**（假 Box + 假 p2pcweb），并带**变异负对照**证明判据有牙齿。
      - name: Beam 出厂预接线自测（幂等 + scope 精确 + 不冲 registry）
        if: always()
        run: bash scripts/prewire-beam-box-selftest.sh
      # 升级前业务库快照回调（fnos#211）：失败此前 `cp … || exit 0` 静默零日志、
      # 轮转按 mtime——都是「错了也不会有人喊」的形态（没有回滚点且零痕迹）
      # ⇒ 必须有能判红的机械化判据 + 变异负对照（告警可判红 / 按名轮转可判红）。
      - name: 升级前快照回调自测（失败必留痕 + 按文件名轮转，自证判红）
        if: always()
        run: bash scripts/upgrade-callback-selftest.sh --selfcheck
      # 管理员口令重置「原地生效」门禁（2026-11-04，fnos#182）：
      # 向导的「重置管理员口令」此前是**平台层删 admin 行**（DELETE FROM users）
      # ⇒ core 按 env 重建 ⇒ admin 的 **user id 变化**
      # ⇒ 名下 88 份分享 + 3 把 API Key 全部成孤儿（真机实录，且全程无告警）。
      # 本门禁跑**真脚本**（真 sqlite 库 + 真 users 行 + 真 .env）并带**变异负对照**：
      # 注入旧行为 ⇒ 「admin 行必须还在」「.env 口令不得被清空」两条判据必须变红。
      - name: 管理员口令原地重置门禁（不删 admin 行 + 留空=不改动）
        if: always()
        run: bash scripts/check-admin-reset-inplace.sh
      # 原地换装脚本的两道门禁（2026-11-04 补接线）：
      # ① 「取不到 PKGVAR 不得终止脚本」——`set -e` + `pipefail` 下取值失败会直接
      #    死在读 env 那步（2026-10-26 审计 P1）；**此前这道门禁从未接进 CI**
      #    ⇒ 门禁存在但等于没跑。
      # ② 「升级必须同步换生命周期脚本 cmd/ + manifest」——此前脚本只换
      #    target/{www,bin,ui} ⇒ 4.8.5 新增的 cmd/prewire_beam_box 缺席、
      #    cmd/main 停在旧版 ⇒ 装了新二进制却跑旧生命周期 = 静默半升级。
      - name: 原地换装门禁（PKGVAR 兜底 + 生命周期脚本同步）
        if: always()
        run: |
          bash scripts/check-upgrade-inplace-pkgvar.sh
          bash scripts/check-upgrade-inplace-cmd-sync.sh
      # 原地换装门禁③（2026-11-10，fnos#200/#201）：
      #   ① **启停走框架托管**(appcenter-cli start/stop)—— 框架注入的
      #      TRIM_APPDEST / TRIM_APPNAME / TRIM_API_TOKEN 只有框架拉起时才有；
      #      手工 nohup 起进程拿不到 ⇒ adapter 判不出原生应用环境
      #      ⇒ /api/fnos/capabilities 回报 gateway=false/sso=false
      #      ⇒ 面板「统一网关免登录」**静默失效**（而升级脚本退出码 0、
      #      版本自证全绿 ⇒ 静默半升级）。真机实录（10.10.30.253）：
      #      改用 appcenter-cli stop/start 后恢复 {true, true}。
      #   ② **注册表版本要同步** —— 面板显示的版本来自宿主 PostgreSQL 的
      #      appcenter 库（**不在**容器里的 pg18）⇒ 不同步就是
      #      「面板 4.8.6 / 实跑 5.7.0」。
      #   ③ 两条**有牙齿**的断言在**沙箱模式**下必须跳过并说明原因
      #      （离线门禁不得被真机断言打断）。
      - name: 原地换装门禁（框架托管启停 + 网关/版本断言）
        if: always()
        run: bash scripts/check-upgrade-inplace-framework-start.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pigeonbox-fpk
          path: fnos/pigeonbox.fpk
          retention-days: 14
          if-no-files-found: error
